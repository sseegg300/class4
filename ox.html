<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OX LED 전광판 (OX LED Signboard)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            font-family: 'Noto Sans KR', 'Gowun Dodum', sans-serif;
            background-color: #08080f;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            /* Safe area padding for mobile notches and side margins */
            padding-top: env(safe-area-inset-top, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }

        /* LED Screen Background Grid Matrix */
        .led-grid {
            background-image: radial-gradient(rgba(255, 255, 255, 0.14) 1.8px, transparent 0);
            background-size: 16px 16px;
            background-position: -8px -8px;
        }

        /* Neon Glow Utility Styles */
        .glow-o {
            color: #3b82f6;
            text-shadow: 
                0 0 12px rgba(59, 130, 246, 0.9),
                0 0 30px rgba(59, 130, 246, 0.7),
                0 0 60px rgba(59, 130, 246, 0.5),
                0 0 120px rgba(59, 130, 246, 0.35);
        }

        .glow-x {
            color: #ef4444;
            text-shadow: 
                0 0 12px rgba(239, 68, 68, 0.9),
                0 0 30px rgba(239, 68, 68, 0.7),
                0 0 60px rgba(239, 68, 68, 0.5),
                0 0 120px rgba(239, 68, 68, 0.35);
        }

        .glow-heart {
            color: #ec4899;
            text-shadow: 
                0 0 14px rgba(236, 72, 153, 0.95),
                0 0 35px rgba(236, 72, 153, 0.75),
                0 0 70px rgba(236, 72, 153, 0.55),
                0 0 130px rgba(236, 72, 153, 0.4);
        }

        /* Animations */
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.92; }
        }

        @keyframes shakeX {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-18px) rotate(-3deg); }
            40%, 80% { transform: translateX(18px) rotate(3deg); }
        }

        @keyframes bounceHeart {
            0% { transform: scale(0.2); opacity: 0; }
            50% { transform: scale(1.22); }
            70% { transform: scale(0.92); }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pulse-glow {
            animation: pulseGlow 1.8s infinite ease-in-out;
        }

        .animate-shake {
            animation: shakeX 0.45s ease-in-out;
        }

        .animate-heart-pop {
            animation: bounceHeart 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .symbol-responsive {
            /* Fit the symbol inside the available area in both tablet orientations. */
            font-size: min(30vw, 32dvh, 28rem);
            font-size: clamp(4rem, min(30vw, 32vh), 28rem);
            line-height: 1;
        }

        /* Safe area bottom padding for iOS/Android bottom gesture bar */
        #bottomControlBar {
            padding-bottom: calc(0.6rem + env(safe-area-inset-bottom, 0px));
        }

        /* Mobile / Small Height Device Optimization */
        @media (max-height: 680px) {
            .header-compact {
                padding-top: 0.25rem !important;
                padding-bottom: 0.25rem !important;
            }
            .symbol-responsive {
                font-size: clamp(3.5rem, min(26vw, 28vh), 18rem) !important;
            }
            .btn-compact {
                padding-top: 0.35rem !important;
                padding-bottom: 0.35rem !important;
            }
        }

        /* Tablets: keep controls compact so the display remains visible above them. */
        @media (min-width: 600px) and (max-width: 1100px) {
            header.header-compact {
                padding: clamp(0.35rem, 1.2vh, 0.8rem) 1rem !important;
            }

            main#mainDisplayArea {
                padding: clamp(0.35rem, 1.5vh, 1rem) !important;
            }

            footer#bottomControlBar {
                padding: clamp(0.45rem, 1.5vh, 1rem) clamp(0.75rem, 3vw, 2rem) calc(clamp(0.45rem, 1.5vh, 1rem) + env(safe-area-inset-bottom, 0px)) !important;
            }

            #bottomControlBar > div {
                gap: clamp(0.5rem, 2vw, 1.25rem) !important;
            }

            #bottomControlBar button {
                min-height: clamp(4.25rem, 12vh, 7rem);
                padding: clamp(0.35rem, 1.5vh, 0.85rem) 0.5rem !important;
            }

            #bottomControlBar button > span:first-of-type {
                font-size: clamp(1.75rem, 5vw, 3.25rem) !important;
                line-height: 1;
            }
        }

        @media (orientation: landscape) and (max-height: 600px) {
            header.header-compact p {
                display: none;
            }

            #bottomControlBar button {
                min-height: 3.5rem;
            }

            #bottomControlBar button > span:first-of-type {
                font-size: clamp(1.5rem, 4vh, 2.5rem) !important;
            }
        }
    </style>
</head>
<body class="fixed inset-0 w-full h-full h-[100dvh] bg-slate-950 flex flex-col justify-between overflow-hidden">

    <!-- Particle Canvas Layer -->
    <canvas id="effectsCanvas" class="absolute inset-0 pointer-events-none z-10 w-full h-full"></canvas>

    <!-- LED Grid Texture Overlay -->
    <div id="ledGridOverlay" class="absolute inset-0 led-grid pointer-events-none z-0 opacity-80"></div>

    <header class="header-compact relative z-20 flex items-center justify-center px-3 py-2 sm:p-3 md:p-4 bg-slate-900/70 backdrop-blur-md border-b border-slate-800/80 shrink-0">
        <div class="flex items-center space-x-2 sm:space-x-4 text-center">
            <div class="w-7 h-7 sm:w-9 sm:h-9 md:w-11 md:h-11 rounded-lg sm:rounded-xl bg-gradient-to-tr from-pink-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-pink-500/30 shrink-0">
                <i class="fa-solid font-bold text-white text-[11px] sm:text-sm md:text-lg">OX</i>
            </div>
            <div>
                <h1 class="text-sm sm:text-lg md:text-2xl font-black tracking-wide bg-gradient-to-r from-pink-400 via-purple-300 to-blue-400 bg-clip-text text-transparent">
                    LED 스마트 전광판
                </h1>
                <p class="text-[10px] sm:text-xs md:text-sm text-slate-400 hidden sm:block">
                    단축키: <span class="text-blue-400 font-semibold">[O]</span> O표시 | <span class="text-red-400 font-semibold">[X]</span> X표시 | <span class="text-pink-400 font-semibold">[H / 스페이스바]</span> 하트
                </p>
            </div>
        </div>
    </header>

    <main id="mainDisplayArea" class="relative z-10 flex-1 flex flex-col items-center justify-center p-2 sm:p-4 md:p-6 min-h-0 cursor-pointer select-none overflow-hidden">
        <div id="displayContainer" class="relative flex items-center justify-center w-full h-full max-w-7xl">
            
            <!-- Default Welcome Display -->
            <div id="symbolWelcome" class="flex flex-col items-center justify-center text-center space-y-3 sm:space-y-6 md:space-y-8 text-slate-500">
                <div class="flex space-x-3 sm:space-x-8 md:space-x-12 text-4xl sm:text-7xl md:text-8xl lg:text-9xl opacity-90">
                    <span class="glow-o hover:scale-110 transition-transform">⭕</span>
                    <span class="glow-x hover:scale-110 transition-transform">❌</span>
                    <span class="glow-heart animate-pulse hover:scale-110 transition-transform">❤️</span>
                </div>
                <p class="text-xs sm:text-lg md:text-2xl lg:text-3xl font-semibold text-slate-300 px-2 leading-relaxed max-w-3xl">
                    하단 버튼이나 키보드/터치로 전광판을 작동해보세요!
                </p>
            </div>

            <!-- Active Dynamic LED Symbol Output -->
            <div id="symbolActive" class="hidden flex items-center justify-center w-full h-full">
                <div id="symbolContent" class="symbol-responsive font-black leading-none flex items-center justify-center transition-all transform duration-150">
                </div>
            </div>

        </div>
    </main>

    <!-- Responsive Bottom Control Bar with Safe Area Support -->
    <footer id="bottomControlBar" class="relative z-20 px-2.5 pt-2.5 sm:p-4 md:p-6 bg-slate-900/85 backdrop-blur-xl border-t border-slate-800/90 shrink-0">
        <div class="max-w-3xl md:max-w-4xl lg:max-w-5xl mx-auto grid grid-cols-3 gap-2 sm:gap-4 md:gap-6">
            
            <!-- O Button -->
            <button id="btnO" class="btn-compact group relative flex flex-col items-center justify-center py-2.5 sm:py-4 md:py-6 px-1.5 sm:px-4 rounded-xl sm:rounded-2xl md:rounded-3xl bg-gradient-to-b from-blue-600 to-blue-800 hover:from-blue-500 hover:to-blue-700 active:scale-95 shadow-lg shadow-blue-900/50 border border-blue-400/30 transition-all duration-150 touch-manipulation">
                <div class="absolute inset-0 rounded-xl sm:rounded-2xl md:rounded-3xl bg-blue-400/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <span class="text-2xl sm:text-4xl md:text-6xl font-black text-white drop-shadow-md transition-transform group-hover:scale-110">⭕</span>
                <span class="mt-1 text-[10px] sm:text-xs md:text-sm font-bold text-blue-100 tracking-wider">O (정답)</span>
            </button>

            <!-- X Button -->
            <button id="btnX" class="btn-compact group relative flex flex-col items-center justify-center py-2.5 sm:py-4 md:py-6 px-1.5 sm:px-4 rounded-xl sm:rounded-2xl md:rounded-3xl bg-gradient-to-b from-red-600 to-red-800 hover:from-red-500 hover:to-red-700 active:scale-95 shadow-lg shadow-red-900/50 border border-red-400/30 transition-all duration-150 touch-manipulation">
                <div class="absolute inset-0 rounded-xl sm:rounded-2xl md:rounded-3xl bg-red-400/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <span class="text-2xl sm:text-4xl md:text-6xl font-black text-white drop-shadow-md transition-transform group-hover:scale-110">❌</span>
                <span class="mt-1 text-[10px] sm:text-xs md:text-sm font-bold text-red-100 tracking-wider">X (오답)</span>
            </button>

            <!-- Heart Button (Padlet Sound Connected) -->
            <button id="btnHeart" class="btn-compact group relative flex flex-col items-center justify-center py-2.5 sm:py-4 md:py-6 px-1.5 sm:px-4 rounded-xl sm:rounded-2xl md:rounded-3xl bg-gradient-to-b from-pink-500 via-rose-600 to-purple-700 hover:from-pink-400 hover:to-purple-600 active:scale-95 shadow-lg shadow-pink-600/50 border border-pink-300/40 transition-all duration-150 touch-manipulation">
                <div class="absolute inset-0 rounded-xl sm:rounded-2xl md:rounded-3xl bg-pink-300/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <span class="text-2xl sm:text-4xl md:text-6xl font-black text-white drop-shadow-md transition-transform group-hover:scale-125 animate-pulse">❤️</span>
                <span class="mt-1 text-[10px] sm:text-xs md:text-sm font-bold text-pink-100 tracking-wider">예쁜 하트</span>
            </button>

        </div>
    </footer>

    <!-- Padlet Audio Asset -->
    <audio id="heartAudio" preload="auto" crossorigin="anonymous">
        <source src="https://u1.padletusercontent.com/uploads/padlet-uploads-usc1/2027944856/52421605b9dcc458086ecd9445e3fed9/effect2.mp3?token=XQNtmV_CIy90evVg65JMm_Dl9NGEm2NBLZUwFYk5S1i9AhZFxOzFzE6_OgEMEF9oIREFrRMoQrjeYjlzZDBQUgQ-1_7xJpUUYk4RGJUFrjPfQwod3ToplxrgDgv1Eg07IPBK3yoj9OqS_rBG1iPOrx-UMkyY0r8tmPWz0tD69zhIhyU-VdOmbNbWVjIb-ZzjNCTuYnYghGV-_x6BVNdeeed2VZed2P8V-v4hZP4hFBGSdViXSYIA5EUsSEAltjOQ" type="audio/mpeg">
    </audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const masterVolume = 0.85;

            // DOM Elements
            const heartAudio = document.getElementById('heartAudio');
            const symbolWelcome = document.getElementById('symbolWelcome');
            const symbolActive = document.getElementById('symbolActive');
            const symbolContent = document.getElementById('symbolContent');
            
            const btnO = document.getElementById('btnO');
            const btnX = document.getElementById('btnX');
            const btnHeart = document.getElementById('btnHeart');

            let audioCtx = null;

            function initAudioContext() {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        audioCtx = new AudioContext();
                    }
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function playOSound() {
                initAudioContext();
                if (!audioCtx) return;

                const now = audioCtx.currentTime;
                
                // Chime Note 1
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, now); // C5
                osc1.frequency.exponentialRampToValueAtTime(1046.50, now + 0.15); // C6

                gain1.gain.setValueAtTime(0.3 * masterVolume, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.6);

                // Chime Note 2
                setTimeout(() => {
                    if (!audioCtx) return;
                    const now2 = audioCtx.currentTime;
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    
                    osc2.type = 'triangle';
                    osc2.frequency.setValueAtTime(1318.51, now2); // E6
                    gain2.gain.setValueAtTime(0.35 * masterVolume, now2);
                    gain2.gain.exponentialRampToValueAtTime(0.001, now2 + 0.5);

                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start(now2);
                    osc2.stop(now2 + 0.5);
                }, 110);
            }

            function playXSound() {
                initAudioContext();
                if (!audioCtx) return;

                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.setValueAtTime(110, now + 0.12);

                gain.gain.setValueAtTime(0.35 * masterVolume, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.5);
            }

            function playHeartSound() {
                initAudioContext();
                try {
                    heartAudio.volume = masterVolume;
                    heartAudio.currentTime = 0;
                    const playPromise = heartAudio.play();
                    
                    if (playPromise !== undefined) {
                        playPromise.catch(() => playHeartSynthFallback());
                    }
                } catch (e) {
                    playHeartSynthFallback();
                }
            }

            function playHeartSynthFallback() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.22);

                gain.gain.setValueAtTime(0.3 * masterVolume, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.45);
            }

            const canvas = document.getElementById('effectsCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];

            function resizeCanvas() {
                const dpr = window.devicePixelRatio || 1;
                const width = document.documentElement.clientWidth;
                const height = document.documentElement.clientHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                canvas.style.width = `${width}px`;
                canvas.style.height = `${height}px`;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            window.addEventListener('resize', resizeCanvas);
            window.visualViewport?.addEventListener('resize', resizeCanvas);
            window.screen?.orientation?.addEventListener('change', resizeCanvas);
            resizeCanvas();

            class Particle {
                constructor(x, y, type) {
                    this.x = x;
                    this.y = y;
                    this.type = type;
                    // Scales particles comfortably on tablets and desktops
                    const sizeScale = window.innerWidth > 768 ? 1.4 : 1.0;
                    this.size = (Math.random() * (type === 'heart' ? 26 : 12) + 12) * sizeScale;
                    this.vx = (Math.random() - 0.5) * (type === 'heart' ? 10 : 16);
                    this.vy = (Math.random() - 0.5) * (type === 'heart' ? 10 : 16) - (type === 'heart' ? 4 : 0);
                    this.gravity = type === 'heart' ? -0.04 : 0.22;
                    this.life = 1;
                    this.decay = Math.random() * 0.02 + 0.015;
                    this.color = type === 'heart' ? `hsl(${Math.random() * 40 + 330}, 100%, 65%)` :
                                 type === 'O' ? `hsl(${Math.random() * 40 + 200}, 100%, 60%)` :
                                 `hsl(${Math.random() * 20 + 350}, 100%, 55%)`;
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotSpeed = (Math.random() - 0.5) * 0.12;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += this.gravity;
                    this.life -= this.decay;
                    this.rotation += this.rotSpeed;
                }

                draw() {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, this.life);
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);

                    if (this.type === 'heart') {
                        ctx.fillStyle = this.color;
                        ctx.font = `${this.size}px serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('❤️', 0, 0);
                    } else if (this.type === 'O') {
                        ctx.strokeStyle = this.color;
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                        ctx.stroke();
                    } else {
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.arc(0, 0, this.size / 3, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.restore();
                }
            }

            function spawnBurst(x, y, type, count = 40) {
                for (let i = 0; i < count; i++) {
                    particles.push(new Particle(x, y, type));
                }
            }

            function animateParticles() {
                ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();
                    if (particles[i].life <= 0) {
                        particles.splice(i, 1);
                    }
                }
                requestAnimationFrame(animateParticles);
            }
            animateParticles();

            function triggerO() {
                symbolWelcome.classList.add('hidden');
                symbolActive.classList.remove('hidden');

                symbolContent.className = "symbol-responsive font-black leading-none flex items-center justify-center glow-o animate-pulse-glow";
                symbolContent.textContent = '⭕';

                triggerFlash('rgba(59, 130, 246, 0.25)');
                spawnBurst(window.innerWidth / 2, window.innerHeight / 2, 'O', window.innerWidth > 768 ? 55 : 35);
                playOSound();
            }

            function triggerX() {
                symbolWelcome.classList.add('hidden');
                symbolActive.classList.remove('hidden');

                symbolContent.className = "symbol-responsive font-black leading-none flex items-center justify-center glow-x animate-shake";
                symbolContent.textContent = '❌';

                triggerFlash('rgba(239, 68, 68, 0.25)');
                spawnBurst(window.innerWidth / 2, window.innerHeight / 2, 'X', window.innerWidth > 768 ? 50 : 30);
                playXSound();
            }

            function triggerHeart() {
                symbolWelcome.classList.add('hidden');
                symbolActive.classList.remove('hidden');

                symbolContent.className = "symbol-responsive font-black leading-none flex items-center justify-center glow-heart animate-heart-pop";
                symbolContent.textContent = '❤️';

                triggerFlash('rgba(236, 72, 153, 0.3)');
                spawnBurst(window.innerWidth / 2, window.innerHeight / 2, 'heart', window.innerWidth > 768 ? 70 : 50);
                playHeartSound();
            }

            function triggerFlash(colorStr) {
                const flashDiv = document.createElement('div');
                flashDiv.className = 'fixed inset-0 pointer-events-none z-15 transition-opacity duration-300';
                flashDiv.style.backgroundColor = colorStr;
                document.body.appendChild(flashDiv);
                
                setTimeout(() => {
                    flashDiv.style.opacity = '0';
                    setTimeout(() => flashDiv.remove(), 300);
                }, 50);
            }

            // Ultra-responsive Pointer / Touch Event Bindings for Mobile & Tablet
            const bindTrigger = (element, triggerFn) => {
                element.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    initAudioContext();
                    triggerFn();
                });
            };

            bindTrigger(btnO, triggerO);
            bindTrigger(btnX, triggerX);
            bindTrigger(btnHeart, triggerHeart);

            // Keyboard Shortcuts
            document.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (key === 'o' || key === '1') {
                    triggerO();
                } else if (key === 'x' || key === '2') {
                    triggerX();
                } else if (key === 'h' || key === '3' || e.code === 'Space') {
                    e.preventDefault();
                    triggerHeart();
                }
            });
        });
    </script>
</body>
</html>
